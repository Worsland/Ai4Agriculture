name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (3.11, 3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ai/requirements.txt
            ai/requirements-api.txt
            ai/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r ai/requirements-dev.txt
      - name: Run test suite
        working-directory: ai
        run: python -m pytest -q

  docker-build:
    name: Build read-only API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: false
          tags: ai4agriculture-api:ci
